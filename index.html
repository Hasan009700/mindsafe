</div>

<!-- Profile Dashboard Bar (shown when logged in) -->
<div id="profile-dashboard-bar" style="display:none;position:fixed;top:64px;right:16px;z-index:9998;background:#FDF8F0;border:1px solid #EDE6DA;border-radius:16px;padding:16px;width:280px;box-shadow:0 12px 32px rgba(0,0,0,0.12);">
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="bar-avatar" style="width:40px;height:40px;border-radius:50%;background:#8FA98B;color:white;display:grid;place-items:center;font-weight:bold;"></div>
    <div>
      <div id="bar-name" style="font-size:14px;font-weight:bold;color:#2D3A2E;"></div>
      <div id="bar-email" style="font-size:11px;color:#5A6B5C;"></div>
    </div>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px;">
    <button onclick="window.openDashboard()" style="flex:1;background:#8FA98B;color:white;padding:8px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;">Dashboard</button>
    <button onclick="window.handleLogout()" style="flex:1;background:white;border:1px solid #EDE6DA;padding:8px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;">Logout</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyCYP7ic3c86Md2cAYxQoGEj9LDGDyJEfn0",
  authDomain: "mindsafe-e6e09.firebaseapp.com",
  projectId: "mindsafe-e6e09",
  storageBucket: "mindsafe-e6e09.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

let currentMode = 'login';

window.openLoginModal = () => {
  currentMode = 'login';
  document.getElementById('auth-modal-title').innerText = 'Login';
  document.getElementById('auth-submit-btn').innerText = 'Login';
  document.getElementById('auth-switch-text').innerText = "Don't have account?";
  document.getElementById('auth-switch-btn').innerText = 'Sign Up';
  document.getElementById('auth-name').style.display = 'none';
  document.getElementById('firebase-auth-modal').style.display = 'flex';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-form-fields').style.display = 'block';
  const user = auth.currentUser;
  if(user){
    showUserDashboard(user);
  } else {
    document.getElementById('auth-user-info').style.display = 'none';
  }
};

window.openSignupModal = () => {
  currentMode = 'signup';
  document.getElementById('auth-modal-title').innerText = 'Sign Up';
  document.getElementById('auth-submit-btn').innerText = 'Create Account';
  document.getElementById('auth-switch-text').innerText = 'Already have account?';
  document.getElementById('auth-switch-btn').innerText = 'Login';
  document.getElementById('auth-name').style.display = 'block';
  document.getElementById('firebase-auth-modal').style.display = 'flex';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-form-fields').style.display = 'block';
  document.getElementById('auth-user-info').style.display = 'none';
};

window.openDashboard = () => {
  const user = auth.currentUser;
  if(user){
    showUserDashboard(user);
    document.getElementById('firebase-auth-modal').style.display = 'flex';
    document.getElementById('auth-form-fields').style.display = 'none';
  }
};

function showUserDashboard(user){
  const name = user.displayName || user.email.split('@')[0];
  const initial = name.charAt(0).toUpperCase();
  document.getElementById('dashboard-name').innerText = name;
  document.getElementById('dashboard-email').innerText = user.email;
  document.getElementById('dashboard-avatar').innerText = initial;
  document.getElementById('auth-user-info').style.display = 'block';
  document.getElementById('auth-form-fields').style.display = 'none';
  document.getElementById('auth-modal-title').innerText = 'My Profile';
  
  // Update bar
  const bar = document.getElementById('profile-dashboard-bar');
  if(bar){
    document.getElementById('bar-name').innerText = name;
    document.getElementById('bar-email').innerText = user.email;
    document.getElementById('bar-avatar').innerText = initial;
  }
  
  // Try to get plans count from page
  try {
    const plansText = document.body.innerText.match(/(\d+) টি প্ল্যান সক্রিয়/)?.[1] || '0';
    document.getElementById('dash-plans').innerText = plansText + ' active';
  } catch(e){}
}

window.closeAuthModal = () => {
  document.getElementById('firebase-auth-modal').style.display = 'none';
};

document.getElementById('firebase-auth-modal')?.addEventListener('click', (e) => {
  if(e.target.id === 'firebase-auth-modal') window.closeAuthModal();
});

document.getElementById('auth-switch-btn')?.addEventListener('click', () => {
  if(currentMode === 'login') window.openSignupModal();
  else window.openLoginModal();
});

document.getElementById('google-signin-btn')?.addEventListener('click', async () => {
  const errorDiv = document.getElementById('auth-error');
  errorDiv.style.display = 'none';
  errorDiv.style.background = '#FEF3C7';
  errorDiv.style.color = '#92400E';
  errorDiv.innerText = 'Google login opening... popup allow করুন';
  errorDiv.style.display = 'block';
  try {
    const result = await signInWithPopup(auth, googleProvider);
    errorDiv.style.display = 'none';
    window.closeAuthModal();
    showUserDashboard(result.user);
    const bar = document.getElementById('profile-dashboard-bar');
    if(bar){ bar.style.display = 'block'; setTimeout(()=>{bar.style.display='none'}, 4000); }
  } catch(err){
    console.error('Popup error:', err);
    if(err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user'){
      errorDiv.innerHTML = '⚠️ Popup blocked! <br>Browser popup allow করুন অথবা নিচের <b>Redirect</b> method use করুন...<br><button id="google-redirect-btn" style="margin-top:10px;background:#4285F4;color:white;padding:8px 16px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;">Continue with Redirect →</button><br><br>অথবা address bar এর পাশে popup blocked icon এ click করে Allow করুন।';
      errorDiv.style.display = 'block';
      errorDiv.style.background = '#FEF3C7';
      errorDiv.style.color = '#92400E';
      
      // Setup redirect button
      setTimeout(()=>{
        document.getElementById('google-redirect-btn')?.addEventListener('click', async () => {
          try {
            const { signInWithRedirect } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
            await signInWithRedirect(auth, googleProvider);
          } catch(e){
            errorDiv.innerText = 'Redirect error: ' + e.message;
            errorDiv.style.display = 'block';
          }
        });
      }, 100);
      
      // Auto try redirect after 2 sec
      try {
        const authMod = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
        // Don't auto redirect, let user click
        console.log('Waiting for user to allow popup or use redirect');
      } catch(e){}
    } else {
      errorDiv.innerText = err.message;
      errorDiv.style.display = 'block';
      errorDiv.style.background = '#FEE2E2';
      errorDiv.style.color = '#991B1B';
    }
  }
});

// Handle redirect result on page load
(async () => {
  try {
    const authMod = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
    const result = await authMod.getRedirectResult(auth);
    if(result && result.user){
      console.log('Redirect login success', result.user.email);
      window.closeAuthModal();
      // Need to wait for showUserDashboard to be defined - it will be called via onAuthStateChanged
      setTimeout(()=>{
        const bar = document.getElementById('profile-dashboard-bar');
        if(bar){ bar.style.display = 'block'; }
      }, 1000);
    }
  } catch(e){
    console.log('No redirect result', e);
  }
})();

document.getElementById('auth-submit-btn')?.addEventListener('click', async () => {
  const name = document.getElementById('auth-name').value.trim();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errorDiv = document.getElementById('auth-error');
  const btn = document.getElementById('auth-submit-btn');
  
  if(currentMode === 'signup' && !name){
    errorDiv.innerText = 'Please enter your name';
    errorDiv.style.display = 'block';
    return;
  }
  if(!email || !password){
    errorDiv.innerText = 'Email and password required';
    errorDiv.style.display = 'block';
    return;
  }
  if(password.length < 6){
    errorDiv.innerText = 'Password must be at least 6 characters';
    errorDiv.style.display = 'block';
    return;
  }

  btn.innerText = 'Please wait...';
  btn.disabled = true;
  errorDiv.style.display = 'none';

  try {
    let userCredential;
    if(currentMode === 'signup'){
      userCredential = await createUserWithEmailAndPassword(auth, email, password);
      // Save name
      await updateProfile(userCredential.user, { displayName: name });
    } else {
      userCredential = await signInWithEmailAndPassword(auth, email, password);
    }
    window.closeAuthModal();
    showUserDashboard(userCredential.user);
    // Show profile bar briefly
    const bar = document.getElementById('profile-dashboard-bar');
    if(bar){ bar.style.display='block'; setTimeout(()=>bar.style.display='none', 4000); }
  } catch (err) {
    console.error(err);
    let msg = err.message;
    if(err.code === 'auth/email-already-in-use'){
      errorDiv.innerHTML = 'এই Email দিয়ে account আছে! <b>Login করুন</b><br><button id="go-login-btn" style="margin-top:8px;background:#8FA98B;color:white;padding:6px 14px;border-radius:999px;border:none;font-size:12px;cursor:pointer;">Go to Login →</button>';
      errorDiv.style.display = 'block';
      errorDiv.style.background = '#FEF3C7';
      errorDiv.style.color = '#92400E';
      setTimeout(()=>{
        const btn = document.getElementById('go-login-btn');
        if(btn) btn.click();
      }, 1500);
      document.addEventListener('click', function handler(e){
        if(e.target && e.target.id === 'go-login-btn'){
          currentMode = 'login';
          document.getElementById('auth-modal-title').innerText = 'Login';
          document.getElementById('auth-submit-btn').innerText = 'Login';
          document.getElementById('auth-switch-text').innerText = "Don't have account?";
          document.getElementById('auth-switch-btn').innerText = 'Sign Up';
          document.getElementById('auth-name').style.display = 'none';
          document.getElementById('auth-error').style.display = 'none';
          document.getElementById('auth-error').innerHTML = '';
          document.removeEventListener('click', handler);
        }
      });
    } else {
      if(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password'){
        errorDiv.innerHTML = '❌ ভুল Password! <br><br><b>সমাধান 2 টা:</b><br>1️⃣ <b>Continue with Google</b> এ click করুন (eh.hasan03@gmail.com Gmail তাই Google দিয়ে direct login হবে)<br>2️⃣ নিচের <b>Forgot Password?</b> এ click করে reset করুন<br><br><button id="try-google-btn" style="background:#4285F4;color:white;padding:8px 16px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;">Try Google Login →</button>';
        errorDiv.style.display = 'block';
        errorDiv.style.background = '#FEF3C7';
        errorDiv.style.color = '#92400E';
        setTimeout(()=>{
          document.getElementById('try-google-btn')?.addEventListener('click', ()=>{
            document.getElementById('google-signin-btn')?.click();
          });
        }, 100);
      } else if(err.code === 'auth/user-not-found'){
        errorDiv.innerText = 'Account পাওয়া যায়নি, Sign Up করুন।';
        errorDiv.style.display = 'block';
        errorDiv.style.background = '#FEE2E2';
        errorDiv.style.color = '#991B1B';
      } else if(err.code === 'auth/weak-password'){
        errorDiv.innerText = 'Password 6 অক্ষরের বেশি দিন।';
        errorDiv.style.display = 'block';
        errorDiv.style.background = '#FEE2E2';
        errorDiv.style.color = '#991B1B';
      } else if(err.code === 'auth/invalid-email'){
        errorDiv.innerText = 'সঠিক Email দিন।';
        errorDiv.style.display = 'block';
        errorDiv.style.background = '#FEE2E2';
        errorDiv.style.color = '#991B1B';
      } else {
        msg = 'Error: ' + msg;
        errorDiv.innerText = msg;
        errorDiv.style.display = 'block';
        errorDiv.style.background = '#FEE2E2';
        errorDiv.style.color = '#991B1B';
      }
    }
  } finally {
    btn.innerText = currentMode === 'signup' ? 'Create Account' : 'Login';
    btn.disabled = false;
  }
});


document.getElementById('forgot-pass-btn')?.addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const errorDiv = document.getElementById('auth-error');
  if(!email){
    errorDiv.innerText = 'Password reset এর জন্য Email লিখুন';
    errorDiv.style.display = 'block';
    errorDiv.style.background = '#FEF3C7';
    errorDiv.style.color = '#92400E';
    return;
  }
  try {
    // Use the already imported sendPasswordResetEmail via dynamic import of auth module
    const authModule = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
    await authModule.sendPasswordResetEmail(auth, email);
    errorDiv.innerHTML = '✅ Reset link পাঠানো হয়েছে!<br><b>' + email + '</b> এর inbox/spam check করুন।<br>Link থেকে নতুন password দিন।';
    errorDiv.style.display = 'block';
    errorDiv.style.background = '#DCFCE7';
    errorDiv.style.color = '#166534';
  } catch(e){
    console.error(e);
    let msg = e.message;
    if(e.code === 'auth/user-not-found') msg = 'এই Email দিয়ে কোনো account নেই। Sign Up করুন।';
    errorDiv.innerText = msg;
    errorDiv.style.display = 'block';
    errorDiv.style.background = '#FEE2E2';
    errorDiv.style.color = '#991B1B';
  }
});

window.handleLogout = async () => {
  await signOut(auth);
  document.getElementById('auth-user-info').style.display = 'none';
  document.getElementById('auth-form-fields').style.display = 'block';
  document.getElementById('profile-dashboard-bar').style.display = 'none';
  window.closeAuthModal();
  location.reload();
};

onAuthStateChanged(auth, (user) => {
  console.log('Auth state', user?.email);
  if(user){
    // Update header buttons to show profile
    setTimeout(()=>{
      const loginBtn = document.getElementById('custom-login-btn');
      const signupBtn = document.getElementById('custom-signup-btn');
      if(loginBtn) loginBtn.innerText = (user.displayName || user.email.split('@')[0]);
      if(signupBtn){
        signupBtn.innerText = 'Dashboard';
        signupBtn.onclick = () => window.openDashboard();
      }
      // Show small profile bar
      const bar = document.getElementById('profile-dashboard-bar');
      if(bar){
        const name = user.displayName || user.email.split('@')[0];
        document.getElementById('bar-name').innerText = name;
        document.getElementById('bar-email').innerText = user.email;
        document.getElementById('bar-avatar').innerText = name.charAt(0).toUpperCase();
      }
    }, 1500);
  }
});

function injectHeaderButtons(){
  const header = document.querySelector('header');
  if(!header){ setTimeout(injectHeaderButtons, 500); return; }
  const actionContainers = header.querySelectorAll('div.flex.items-center.gap-2');
  let target = null;
  for(const c of actionContainers){
    if(c.innerHTML.includes('My Plans') || c.innerHTML.includes('WhatsApp') || c.innerHTML.includes('wa.me')){
      target = c; break;
    }
  }
  if(!target){
    const all = header.querySelectorAll('div');
    for(const d of all){
      if(d.className && d.className.includes('gap-2') && d.className.includes('flex') && d.textContent.includes('My Plans')){
        target = d; break;
      }
    }
  }
  if(!target){ setTimeout(injectHeaderButtons, 800); return; }

  target.innerHTML = `
    <button id="custom-login-btn" style="font-size:13px;font-weight:500;padding:8px 20px;border-radius:999px;border:1px solid #D9D0BE;background:white;cursor:pointer;">Login</button>
    <button id="custom-signup-btn" style="font-size:13px;font-weight:600;padding:10px 20px;border-radius:999px;border:none;background:#8FA98B;color:white;cursor:pointer;">Sign Up</button>
    <a href="https://wa.me/8801932612133" target="_blank" style="font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;background:#25D366;color:white;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">WhatsApp</a>
  `;
  
  document.getElementById('custom-login-btn')?.addEventListener('click', () => window.openLoginModal());
  document.getElementById('custom-signup-btn')?.addEventListener('click', () => window.openSignupModal());

  const user = auth.currentUser;
  if(user){
    const loginBtn = document.getElementById('custom-login-btn');
    const signupBtn = document.getElementById('custom-signup-btn');
    if(loginBtn) loginBtn.innerText = (user.displayName || user.email.split('@')[0]);
    if(signupBtn){
      signupBtn.innerText = 'Dashboard';
      signupBtn.onclick = () => window.openDashboard();
    }
  }
}

setTimeout(injectHeaderButtons, 1000);
setTimeout(injectHeaderButtons, 2500);

function enhanceMyPlansCard(){
  document.querySelectorAll('*').forEach(el => {
    if(el.textContent && el.textContent.includes('এখনো কোনো প্ল্যান নেননি') && el.className && el.className.includes('bg-[#2D3A2E]')){
      const parent = el.closest('div.mt-4');
      if(parent && !parent.querySelector('#myplans-login-btn')){
        const btnRow = document.createElement('div');
        btnRow.style.cssText = 'margin-top:12px;display:flex;gap:8px;';
        btnRow.innerHTML = `<button id="myplans-login-btn" style="flex:1;background:white;color:#2D3A2E;padding:8px;border-radius:999px;border:none;font-size:12px;font-weight:bold;cursor:pointer;">Login</button><button id="myplans-dash-btn" style="flex:1;background:#8FA98B;color:white;padding:8px;border-radius:999px;border:none;font-size:12px;font-weight:bold;cursor:pointer;">Dashboard</button>`;
        parent.appendChild(btnRow);
        document.getElementById('myplans-login-btn')?.addEventListener('click', () => window.openLoginModal());
        document.getElementById('myplans-dash-btn')?.addEventListener('click', () => window.openDashboard());
      }
    }
  });
}
setTimeout(enhanceMyPlansCard, 2000);
setTimeout(enhanceMyPlansCard, 4000);
</script>
